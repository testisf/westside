# Render Blueprint for Westside
# Docs: https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then go to https://dashboard.render.com → New → Blueprint
#         and select your repo. Render will create all three services automatically.

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — managed database
  # ─────────────────────────────────────────────────────────────────────────
  - type: pserv
    name: westside-postgres
    env: docker
    region: ohio  # change to your nearest region
    plan: free    # free tier: 30 days, then deleted; upgrade to "starter" for $7/mo
    dockerfilePath: ./infra/docker/Dockerfile.postgres
    autoDeploy: false
    envVars:
      - key: POSTGRES_USER
        value: westside
      - key: POSTGRES_PASSWORD
        sync: false  # Render generates a random value; you'll see it in the dashboard
      - key: POSTGRES_DB
        value: westside

  # If you'd rather use Render's managed Postgres (recommended), delete the
  # pserv above and create one manually:
  #   Dashboard → New + → PostgreSQL → Free → Create
  # Then copy the "Internal Database URL" — you'll set it as DATABASE_URL on the API.

  # ─────────────────────────────────────────────────────────────────────────
  # Redis — managed cache
  # ─────────────────────────────────────────────────────────────────────────
  # Render doesn't have a free Redis in the blueprint format yet — create it
  # manually:
  #   Dashboard → New + → Redis → Free → Create
  # Then copy the "Internal Redis URL" — you'll set it as REDIS_URL on the API.

  # ─────────────────────────────────────────────────────────────────────────
  # Westside API — Fastify web service
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: westside-api
    env: docker
    region: ohio
    plan: free  # free tier: sleeps after 15 min idle; upgrade to "starter" for $7/mo
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_PORT
        value: "4000"
      - key: API_BASE_URL
        # Render injects the public URL of the service. We use a placeholder;
        # after first deploy, replace this with the actual URL Render assigns:
        value: https://westside-api.onrender.com
      - key: WEB_BASE_URL
        value: https://westside.local
      - key: CORS_ORIGINS
        # Comma-separated. Add your web dashboard URL + any other client URLs.
        value: http://localhost:3000,https://westside.local
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: westside-postgres
          property: connectionString
      # If you use Render's MANAGED Postgres instead, replace the fromService
      # block above with:
      # - key: DATABASE_URL
      #   sync: false
      # Then set the value manually in the dashboard after creating the DB.
      - key: REDIS_URL
        # Set this manually in the dashboard after creating the Redis instance.
        sync: false
      - key: JWT_ISSUER
        value: westside
      - key: JWT_AUDIENCE
        value: westside-clients
      - key: ACCESS_TOKEN_TTL
        value: "60"
      - key: REFRESH_TOKEN_TTL
        value: "2592000"
      - key: ARGON2_MEMORY_KIB
        value: "65536"
      - key: ARGON2_TIME_COST
        value: "3"
      - key: ARGON2_PARALLELISM
        value: "4"
      - key: RATE_LIMIT_PER_MINUTE_IP
        value: "120"
      - key: RATE_LIMIT_PER_MINUTE_USER
        value: "600"
      - key: LOGIN_RATE_LIMIT_PER_15MIN
        value: "5"
      - key: ACCOUNT_LOCKOUT_THRESHOLD
        value: "5"
      - key: ACCOUNT_LOCKOUT_DURATION_MINUTES
        value: "15"
      - key: EMAIL_VERIFICATION_TTL_HOURS
        value: "24"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "15"
      - key: MAIL_FROM
        value: Westside <no-reply@westside.local>
      - key: BOOTSTRAP_OWNER_EMAIL
        value: owner@westside.local
      - key: BOOTSTRAP_OWNER_USERNAME
        value: owner
      - key: BOOTSTRAP_OWNER_PASSWORD
        # CHANGE THIS. Use a strong, unique password — anyone who knows this
        # can log in as OWNER (full admin) on your deployment.
        sync: false
      # JWT signing keys — generate locally with openssl, then paste the
      # PEM content here (Render stores them encrypted at rest).
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
